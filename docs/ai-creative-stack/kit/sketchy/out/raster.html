<script>
const img = document.getElementById('s');
img.onload = () => {
  const c = document.createElement('canvas'); c.width = 900; c.height = 560;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 900, 560); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, 900, 560).data;
  let ink = 0, pink = 0, blue = 0;

    const r = d[i], g = d[i + 1], b = d[i + 2];

    if (b > 150 && r < 120) blue++;

  window.__ink = { ink: ink / (900 * 560), pink, blue };
  window.__ready = true;
};
