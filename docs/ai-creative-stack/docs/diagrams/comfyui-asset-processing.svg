<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 1040" role="img" aria-labelledby="title desc">
<title id="title">Repeatable ComfyUI asset processing</title><desc id="desc">A reviewed workflow JSON is the unit of repeatability. Everything it needs is pinned.</desc>
<style>
svg{font-family:system-ui,-apple-system,sans-serif} .bg{fill:#fbfcff} text{fill:#152137} .sub{fill:#465773} .line{stroke:#62738d;fill:none;stroke-width:2} .dash{stroke-dasharray:6 5} .panel{fill:#fff;stroke:#d0d9e7} .lab{fill:#fbfcff} .arrow{fill:#62738d}
