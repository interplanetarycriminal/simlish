<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 908 904" role="img" aria-labelledby="title desc">
<title id="title">Real-world spatial reconstruction</title><desc id="desc">Capture quality decides the result. Splats stay splats unless a verified conversion is recorded.</desc>
