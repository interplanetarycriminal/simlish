<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 768" role="img" aria-labelledby="title desc">
<title id="title">Illustration and animated storytelling</title><desc id="desc">Each arrow names the artifact the next step receives.</desc>
<style>
svg{font-family:system-ui,-apple-system,sans-serif} .bg{fill:#fbfcff} text{fill:#152137} .sub{fill:#465773} .line{stroke:#62738d;fill:none;stroke-width:2} .dash{stroke-dasharray:6 5} .panel{fill:#fff;stroke:#d0d9e7} .lab{fill:#fbfcff} .arrow{fill:#62738d}
@media(prefers-color-scheme:dark){.bg{fill:#101829} text{fill:#f2f5fb} .sub{fill:#c2cee1} .line{stroke:#a4b7d1} .panel{fill:#182439;stroke:#435570} .lab{fill:#101829} .arrow{fill:#a4b7d1}}
</style>
<defs><marker id="end" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="arrow" d="M0 0 7 3.5 0 7z"/></marker></defs>
<rect width="745" height="768" rx="22" class="bg"/>
<text x="36" y="48" font-size="29" font-weight="750">Illustration and animated storytelling</text>
<text x="37" y="75" font-size="15" font-weight="450" class="sub">Each arrow names the artifact the next step receives.</text>
<path d="M372 180 V242" class="line" marker-end="url(#end)"/>
<path d="M372 316 V378" class="line" marker-end="url(#end)"/>
<path d="M372 452 V514" class="line" marker-end="url(#end)"/>
<path d="M372 588 V650" class="line" marker-end="url(#end)"/>
<path d="M522 552 H558 V280 H524" class="line dash" marker-end="url(#end)"/>
<rect x="378" y="203" width="118" height="20" rx="5" class="lab"/><text x="384" y="217" font-size="12.5" font-weight="560" class="sub">approved sample</text>
<rect x="378" y="339" width="147" height="20" rx="5" class="lab"/><text x="384" y="353" font-size="12.5" font-weight="560" class="sub">SVG or alpha frames</text>
<rect x="378" y="475" width="97" height="20" rx="5" class="lab"/><text x="384" y="489" font-size="12.5" font-weight="560" class="sub">test segment</text>
<rect x="378" y="611" width="133" height="20" rx="5" class="lab"/><text x="384" y="625" font-size="12.5" font-weight="560" class="sub">approved sequence</text>
<rect x="526" y="529" width="161" height="20" rx="5" class="lab"/><text x="532" y="543" font-size="12.5" font-weight="560" class="sub">off-model or off-beat</text>
<rect x="222" y="108" width="300" height="72" rx="13" class="panel"/><rect x="234" y="132" width="7" height="24" rx="3.5" fill="#733ed0"/>
<text x="250" y="140" font-size="16.5" font-weight="720">Approve the style</text><text x="250" y="160" font-size="13" font-weight="450" class="sub">one sample figure, silhouette, line</text>
<rect x="222" y="244" width="300" height="72" rx="13" class="panel"/><rect x="234" y="268" width="7" height="24" rx="3.5" fill="#a05212"/>
<text x="250" y="276" font-size="16.5" font-weight="720">Create SVG assets</text><text x="250" y="296" font-size="13" font-weight="450" class="sub">stable viewBox, paths, names</text>
<rect x="222" y="380" width="300" height="72" rx="13" class="panel"/><rect x="234" y="404" width="7" height="24" rx="3.5" fill="#087d73"/>
<text x="250" y="412" font-size="16.5" font-weight="720">Sequence motion</text><text x="250" y="432" font-size="13" font-weight="450" class="sub">storyboard timing, one compositor</text>
<rect x="222" y="516" width="300" height="72" rx="13" class="panel"/><rect x="234" y="540" width="7" height="24" rx="3.5" fill="#198047"/>
<text x="250" y="548" font-size="16.5" font-weight="720">Inspect the rhythm</text><text x="250" y="568" font-size="13" font-weight="450" class="sub">frame sheets at delivery size</text>
<rect x="222" y="652" width="300" height="72" rx="13" class="panel"/><rect x="234" y="676" width="7" height="24" rx="3.5" fill="#198047"/>
<text x="250" y="684" font-size="16.5" font-weight="720">Deliver fallback</text><text x="250" y="704" font-size="13" font-weight="450" class="sub">static or reduced-motion version</text>
