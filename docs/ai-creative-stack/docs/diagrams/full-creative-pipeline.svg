<path d="M454 452 V514" class="line" marker-end="url(#end)"/>
<rect x="272" y="219" width="104" height="20" rx="5" class="lab"/><text x="278" y="233" font-size="12.5" font-weight="560" class="sub">frozen tokens</text>
<rect x="648" y="219" width="104" height="20" rx="5" class="lab"/><text x="654" y="233" font-size="12.5" font-weight="560" class="sub">art direction</text>
<rect x="514" y="326" width="118" height="20" rx="5" class="lab"/><text x="520" y="340" font-size="12.5" font-weight="560" class="sub">rendered frames</text>
