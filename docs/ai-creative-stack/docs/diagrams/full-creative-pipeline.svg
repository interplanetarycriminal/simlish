<rect x="304" y="380" width="300" height="72" rx="13" class="panel"/><rect x="316" y="404" width="7" height="24" rx="3.5" fill="#087d73"/>
<text x="332" y="412" font-size="16.5" font-weight="720">Reuse assets in video</text><text x="332" y="432" font-size="13" font-weight="450" class="sub">approved clips and illustrations</text>
