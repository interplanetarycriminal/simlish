<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 908 632" role="img" aria-labelledby="title desc">
<title id="title">One scene, two clocks</title><desc id="desc">The scene only knows story time. Drivers choose the clock; any paused frame reopens live.</desc>
<style>
svg{font-family:system-ui,-apple-system,sans-serif} .bg{fill:#fbfcff} text{fill:#152137} .sub{fill:#465773} .line{stroke:#62738d;fill:none;stroke-width:2} .dash{stroke-dasharray:6 5} .panel{fill:#fff;stroke:#d0d9e7} .lab{fill:#fbfcff} .arrow{fill:#62738d}
@media(prefers-color-scheme:dark){.bg{fill:#101829} text{fill:#f2f5fb} .sub{fill:#c2cee1} .line{stroke:#a4b7d1} .panel{fill:#182439;stroke:#435570} .lab{fill:#101829} .arrow{fill:#a4b7d1}}
</style>
<defs><marker id="end" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="arrow" d="M0 0 7 3.5 0 7z"/></marker></defs>
<rect width="908" height="632" rx="22" class="bg"/>
<text x="36" y="48" font-size="29" font-weight="750">One scene, two clocks</text>
<text x="37" y="75" font-size="15" font-weight="450" class="sub">The scene only knows story time. Drivers choose the clock; any paused frame reopens live.</text>
<path d="M266 180 V212 H454 V242" class="line" marker-end="url(#end)"/>
<path d="M642 180 V212 H454 V242" class="line" marker-end="url(#end)"/>
<path d="M454 316 V348 H266 V378" class="line" marker-end="url(#end)"/>
<path d="M454 316 V348 H642 V378" class="line" marker-end="url(#end)"/>
<path d="M266 452 V484 H454 V514" class="line" marker-end="url(#end)"/>
<path d="M642 452 V484 H454 V514" class="line" marker-end="url(#end)"/>
<path d="M492 416 H418" class="line dash" marker-end="url(#end)"/>
<rect x="272" y="190" width="83" height="20" rx="5" class="lab"/><text x="278" y="204" font-size="12.5" font-weight="560" class="sub">setTime(t)</text>
<rect x="506" y="190" width="126" height="20" rx="5" class="lab"/><text x="512" y="204" font-size="12.5" font-weight="560" class="sub">setTime(i / fps)</text>
<rect x="272" y="355" width="83" height="20" rx="5" class="lab"/><text x="278" y="369" font-size="12.5" font-weight="560" class="sub">draws live</text>
<rect x="648" y="355" width="97" height="20" rx="5" class="lab"/><text x="654" y="369" font-size="12.5" font-weight="560" class="sub">draws frames</text>
<rect x="272" y="462" width="83" height="20" rx="5" class="lab"/><text x="278" y="476" font-size="12.5" font-weight="560" class="sub">#t= digest</text>
<rect x="535" y="462" width="97" height="20" rx="5" class="lab"/><text x="541" y="476" font-size="12.5" font-weight="560" class="sub">frame digest</text>
<rect x="418" y="392" width="69" height="20" rx="5" class="lab"/><text x="424" y="406" font-size="12.5" font-weight="560" class="sub">#t= link</text>
<rect x="116" y="108" width="300" height="72" rx="13" class="panel"/><rect x="128" y="132" width="7" height="24" rx="3.5" fill="#2363cf"/>
<text x="144" y="140" font-size="16.5" font-weight="720">Wall clock</text><text x="144" y="160" font-size="13" font-weight="450" class="sub">requestAnimationFrame, learner input</text>
<rect x="492" y="108" width="300" height="72" rx="13" class="panel"/><rect x="504" y="132" width="7" height="24" rx="3.5" fill="#087d73"/>
<text x="520" y="140" font-size="16.5" font-weight="720">Frame clock</text><text x="520" y="160" font-size="13" font-weight="450" class="sub">frame / fps from the compositor</text>
<rect x="304" y="244" width="300" height="72" rx="13" class="panel"/><rect x="316" y="268" width="7" height="24" rx="3.5" fill="#a05212"/>
<text x="332" y="276" font-size="16.5" font-weight="720">Scene module</text><text x="332" y="296" font-size="13" font-weight="450" class="sub">setTime(t), setBeat(n), digest()</text>
<rect x="116" y="380" width="300" height="72" rx="13" class="panel"/><rect x="128" y="404" width="7" height="24" rx="3.5" fill="#2363cf"/>
<text x="144" y="412" font-size="16.5" font-weight="720">Explorable</text><text x="144" y="432" font-size="13" font-weight="450" class="sub">play, scrub, predict</text>
<rect x="492" y="380" width="300" height="72" rx="13" class="panel"/><rect x="504" y="404" width="7" height="24" rx="3.5" fill="#087d73"/>
<text x="520" y="412" font-size="16.5" font-weight="720">Film</text><text x="520" y="432" font-size="13" font-weight="450" class="sub">HyperFrames, Remotion, DevTools capture</text>
<rect x="304" y="516" width="300" height="72" rx="13" class="panel"/><rect x="316" y="540" width="7" height="24" rx="3.5" fill="#198047"/>
<text x="332" y="548" font-size="16.5" font-weight="720">Same state at the same t</text><text x="332" y="568" font-size="13" font-weight="450" class="sub">checked by digest</text>
</svg>
