<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 1340" role="img" aria-labelledby="title desc">
<title id="title">Strategy layer: governance</title><desc id="desc">Small reversible tasks run directly; larger ones become bounded packages under deterministic limits. Gates decide the outcome.</desc>
