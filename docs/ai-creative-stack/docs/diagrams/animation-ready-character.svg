<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 1312" role="img" aria-labelledby="title desc">
<title id="title">Animation-ready character production</title><desc id="desc">Deformation drives every decision. Each arrow names the versioned asset the next step consumes.</desc>
