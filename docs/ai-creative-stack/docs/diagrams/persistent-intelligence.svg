<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 750" role="img" aria-labelledby="title desc">
<title id="title">Persistent project intelligence</title><desc id="desc">Three distinct inputs reach the agent. Only approved decisions flow back. Memory never overrides the current instruction.</desc>
