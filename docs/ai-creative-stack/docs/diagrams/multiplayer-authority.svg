<rect x="492" y="108" width="300" height="72" rx="13" class="panel"/><rect x="504" y="132" width="7" height="24" rx="3.5" fill="#2363cf"/>
<text x="520" y="140" font-size="16.5" font-weight="720">Client B</text><text x="520" y="160" font-size="13" font-weight="450" class="sub">input intents</text>
