<rect x="577" y="190" width="55" height="20" rx="5" class="lab"/><text x="583" y="204" font-size="12.5" font-weight="560" class="sub">intent</text>
<rect x="460" y="475" width="69" height="20" rx="5" class="lab"/><text x="466" y="489" font-size="12.5" font-weight="560" class="sub">accepted</text>
