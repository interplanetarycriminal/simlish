<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 986" role="img" aria-labelledby="title desc">
<title id="title">Reference comparison loop</title><desc id="desc">Capture an authorized reference, rebuild with original assets, recapture under the same conditions, compare within tolerance.</desc>
<style>
svg{font-family:system-ui,-apple-system,sans-serif} .bg{fill:#fbfcff} text{fill:#152137} .sub{fill:#465773} .line{stroke:#62738d;fill:none;stroke-width:2} .dash{stroke-dasharray:6 5} .panel{fill:#fff;stroke:#d0d9e7} .lab{fill:#fbfcff} .arrow{fill:#62738d}
@media(prefers-color-scheme:dark){.bg{fill:#101829} text{fill:#f2f5fb} .sub{fill:#c2cee1} .line{stroke:#a4b7d1} .panel{fill:#182439;stroke:#435570} .lab{fill:#101829} .arrow{fill:#a4b7d1}}
</style>
<defs><marker id="end" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="arrow" d="M0 0 7 3.5 0 7z"/></marker></defs>
<rect width="745" height="986" rx="22" class="bg"/>
<text x="36" y="48" font-size="29" font-weight="750">Reference comparison loop</text>
<text x="37" y="75" font-size="15" font-weight="450" class="sub">Capture an authorized reference, rebuild with original assets, recapture under the same conditions, compare within tolerance.</text>
<path d="M372 162 V224" class="line" marker-end="url(#end)"/>
<path d="M372 298 V360" class="line" marker-end="url(#end)"/>
<path d="M372 434 V496" class="line" marker-end="url(#end)"/>
<path d="M372 570 V632" class="line" marker-end="url(#end)"/>
<path d="M372 706 V768" class="line" marker-end="url(#end)"/>
<path d="M372 824 V886" class="line" marker-end="url(#end)"/>
<path d="M522 797 H558 V398 H524" class="line dash" marker-end="url(#end)"/>
<rect x="378" y="321" width="62" height="20" rx="5" class="lab"/><text x="384" y="335" font-size="12.5" font-weight="560" class="sub">timings</text>
<rect x="378" y="847" width="33" height="20" rx="5" class="lab"/><text x="384" y="861" font-size="12.5" font-weight="560" class="sub">Yes</text>
<rect x="526" y="774" width="83" height="20" rx="5" class="lab"/><text x="532" y="788" font-size="12.5" font-weight="560" class="sub">No: refine</text>
<rect x="222" y="108" width="300" height="54" rx="13" class="panel"/><rect x="234" y="123" width="7" height="24" rx="3.5" fill="#596b84"/>
<text x="250" y="141" font-size="17" font-weight="720">Authorized motion reference</text>
<rect x="222" y="226" width="300" height="72" rx="13" class="panel"/><rect x="234" y="250" width="7" height="24" rx="3.5" fill="#087d73"/>
<text x="250" y="258" font-size="16.5" font-weight="720">Capture</text><text x="250" y="278" font-size="13" font-weight="450" class="sub">viewport, scale, frame rate, state</text>
<rect x="222" y="362" width="300" height="72" rx="13" class="panel"/><rect x="234" y="386" width="7" height="24" rx="3.5" fill="#2363cf"/>
<text x="250" y="394" font-size="16.5" font-weight="720">Original implementation</text><text x="250" y="414" font-size="13" font-weight="450" class="sub">Motion or GSAP</text>
<rect x="222" y="498" width="300" height="72" rx="13" class="panel"/><rect x="234" y="522" width="7" height="24" rx="3.5" fill="#087d73"/>
<text x="250" y="530" font-size="16.5" font-weight="720">Recapture</text><text x="250" y="550" font-size="13" font-weight="450" class="sub">same conditions</text>
<rect x="222" y="634" width="300" height="72" rx="13" class="panel"/><rect x="234" y="658" width="7" height="24" rx="3.5" fill="#198047"/>
<text x="250" y="666" font-size="16.5" font-weight="720">Compare</text><text x="250" y="686" font-size="13" font-weight="450" class="sub">event timings, trajectories</text>
<rect x="222" y="770" width="300" height="54" rx="13" class="panel" style="stroke-dasharray:4 3"/><path d="M238 788 L248 797 L238 806 L230 797Z" fill="#596b84"/>
<text x="250" y="803" font-size="17" font-weight="720">Within tolerance?</text>
<rect x="222" y="888" width="300" height="54" rx="13" class="panel"/><rect x="234" y="903" width="7" height="24" rx="3.5" fill="#198047"/>
<text x="250" y="921" font-size="17" font-weight="720">Record the comparison and ship</text>
</svg>
