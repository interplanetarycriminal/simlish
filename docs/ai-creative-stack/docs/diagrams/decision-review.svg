<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 908 904" role="img" aria-labelledby="title desc">
<title id="title">Decision review</title><desc id="desc">At least two alternatives, one chosen against the constraints, rejected ones kept with reasons. Unrun alternatives stay hypotheses.</desc>
<style>
svg{font-family:system-ui,-apple-system,sans-serif} .bg{fill:#fbfcff} text{fill:#152137} .sub{fill:#465773} .line{stroke:#62738d;fill:none;stroke-width:2} .dash{stroke-dasharray:6 5} .panel{fill:#fff;stroke:#d0d9e7} .lab{fill:#fbfcff} .arrow{fill:#62738d}
@media(prefers-color-scheme:dark){.bg{fill:#101829} text{fill:#f2f5fb} .sub{fill:#c2cee1} .line{stroke:#a4b7d1} .panel{fill:#182439;stroke:#435570} .lab{fill:#101829} .arrow{fill:#a4b7d1}}
</style>
<defs><marker id="end" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="arrow" d="M0 0 7 3.5 0 7z"/></marker></defs>
<rect width="908" height="904" rx="22" class="bg"/>
<text x="36" y="48" font-size="29" font-weight="750">Decision review</text>
<text x="37" y="75" font-size="15" font-weight="450" class="sub">At least two alternatives, one chosen against the constraints, rejected ones kept with reasons. Unrun alternatives stay hypotheses.</text>
