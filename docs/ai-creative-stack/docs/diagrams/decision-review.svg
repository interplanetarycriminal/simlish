<path d="M642 588 V620 H454 V650" class="line dash" marker-end="url(#end)"/>
<path d="M454 724 V786" class="line" marker-end="url(#end)"/>
<rect x="648" y="475" width="69" height="20" rx="5" class="lab"/><text x="654" y="489" font-size="12.5" font-weight="560" class="sub">if cheap</text>
<rect x="304" y="108" width="300" height="72" rx="13" class="panel"/><rect x="316" y="132" width="7" height="24" rx="3.5" fill="#596b84"/>
<text x="332" y="140" font-size="16.5" font-weight="720">Consequential decision</text><text x="332" y="160" font-size="13" font-weight="450" class="sub">constraints</text>
