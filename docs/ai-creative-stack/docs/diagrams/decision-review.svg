<text x="332" y="276" font-size="16.5" font-weight="720">Viable alternatives</text><text x="332" y="296" font-size="13" font-weight="450" class="sub">including keeping the current one</text>
<rect x="116" y="380" width="300" height="72" rx="13" class="panel"/><rect x="128" y="404" width="7" height="24" rx="3.5" fill="#733ed0"/>
<text x="144" y="422" font-size="17" font-weight="720">Selected against constraints</text>
<rect x="492" y="380" width="300" height="72" rx="13" class="panel"/><rect x="504" y="404" width="7" height="24" rx="3.5" fill="#733ed0"/>
<text x="520" y="412" font-size="16.5" font-weight="720">Rejected options</text><text x="520" y="432" font-size="13" font-weight="450" class="sub">with reasons</text>
<rect x="116" y="516" width="300" height="72" rx="13" class="panel"/><rect x="128" y="540" width="7" height="24" rx="3.5" fill="#198047"/>
<text x="144" y="548" font-size="16.5" font-weight="720">Observed outcome</text><text x="144" y="568" font-size="13" font-weight="450" class="sub">measured</text>
<rect x="492" y="516" width="300" height="72" rx="13" class="panel"/><rect x="504" y="540" width="7" height="24" rx="3.5" fill="#087d73"/>
<text x="520" y="548" font-size="16.5" font-weight="720">Optional comparable experiment</text><text x="520" y="568" font-size="13" font-weight="450" class="sub">same inputs, same metrics</text>
<rect x="304" y="652" width="300" height="72" rx="13" class="panel"/><rect x="316" y="676" width="7" height="24" rx="3.5" fill="#198047"/>
