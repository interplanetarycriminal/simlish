<text x="36" y="48" font-size="29" font-weight="750">React 3D scene architecture</text>
<text x="37" y="75" font-size="15" font-weight="450" class="sub">React Three Fiber renders Three.js declaratively. One frame loop, one animation owner per transform.</text>
