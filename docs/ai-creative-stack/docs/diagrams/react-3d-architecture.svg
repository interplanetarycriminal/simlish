<text x="520" y="140" font-size="16.5" font-weight="720">Animation owner</text><text x="520" y="160" font-size="13" font-weight="450" class="sub">mixer, Theatre track or GSAP</text>
<rect x="868" y="108" width="300" height="72" rx="13" class="panel"/><rect x="880" y="132" width="7" height="24" rx="3.5" fill="#596b84"/>
<text x="896" y="140" font-size="16.5" font-weight="720">Frame loop</text><text x="896" y="160" font-size="13" font-weight="450" class="sub">always, demand or never + advance()</text>
<rect x="492" y="244" width="300" height="72" rx="13" class="panel"/><rect x="504" y="268" width="7" height="24" rx="3.5" fill="#2363cf"/>
<text x="520" y="276" font-size="16.5" font-weight="720">Loader</text><text x="520" y="296" font-size="13" font-weight="450" class="sub">useGLTF or GLTFLoader</text>
<rect x="492" y="380" width="300" height="72" rx="13" class="panel"/><rect x="504" y="404" width="7" height="24" rx="3.5" fill="#2363cf"/>
<text x="520" y="412" font-size="16.5" font-weight="720">React Three Fiber scene</text><text x="520" y="432" font-size="13" font-weight="450" class="sub">components</text>
<rect x="492" y="516" width="300" height="72" rx="13" class="panel"/><rect x="504" y="540" width="7" height="24" rx="3.5" fill="#2363cf"/>
<text x="520" y="548" font-size="16.5" font-weight="720">Three.js renderer</text><text x="520" y="568" font-size="13" font-weight="450" class="sub">underneath</text>
