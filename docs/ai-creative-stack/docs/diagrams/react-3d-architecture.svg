<rect x="116" y="108" width="300" height="72" rx="13" class="panel"/><rect x="128" y="132" width="7" height="24" rx="3.5" fill="#a05212"/>
<text x="144" y="140" font-size="16.5" font-weight="720">Validated GLB</text><text x="144" y="160" font-size="13" font-weight="450" class="sub">Blender or Blockbench</text>
