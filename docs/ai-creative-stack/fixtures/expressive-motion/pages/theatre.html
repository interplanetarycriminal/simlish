<!doctype html>
<meta charset="utf-8">
<title>theatre seek probe</title>
<style>
  body { margin: 0; background: #f4f1ea; }
  #box { position: absolute; top: 40px; left: 20px; width: 40px; height: 40px; background: #3d7a4f; }
</style>
<div id="box"></div>
<script type="module">
  import { esm, readX, twoFrames, fetchedModules, VERSIONS } from './shared.js';
  try {
    const core = await import(esm('@theatre/core'));
    const getProject = core.getProject || core.default.getProject;
    // Hand-written project state (no studio). One object, one keyframed prop "x":
    //   t = 0 s: 0, t = 1 s: 120 (straight segment), t = 2 s: 40 (ease-in-out segment).
    // A segment from keyframe A to B is shaped by A's right handle (handles[2], handles[3]) and
    // B's left handle (handles[0], handles[1]). Handles on the diagonal give a straight line.
    const state = {
      sheetsById: {
        Stage: {
          staticOverrides: { byObject: {} },
          sequence: {
            type: 'PositionalSequence',
            length: 2,
            subUnitsPerUnit: 24,
            tracksByObject: {
              Box: {
                trackIdByPropPath: { '["x"]': 'trackX' },
                trackData: {
                  trackX: {
                    type: 'BasicKeyframedTrack',
                    __debugName: 'Box:["x"]',
                    keyframes: [
                      { id: 'k0', position: 0, value: 0, connectedRight: true, handles: [0.5, 0.5, 1 / 3, 1 / 3], type: 'bezier' },
                      { id: 'k1', position: 1, value: 120, connectedRight: true, handles: [2 / 3, 2 / 3, 0.42, 0], type: 'bezier' },
                      { id: 'k2', position: 2, value: 40, connectedRight: true, handles: [0.58, 1, 0.5, 0.5], type: 'bezier' },
                    ],
                  },
                },
              },
            },
          },
        },
      },
      definitionVersion: '0.4.0',
      revisionHistory: ['fixture-r1'],
    };
    const project = getProject('ExpressiveMotionFixture', { state });
    await project.ready;
    const sheet = project.sheet('Stage');
    const box = sheet.object('Box', { x: 0 });
    const el = document.getElementById('box');
    // Theatre owns x of #box. The DOM write is a pure function of the Theatre value.
    box.onValuesChange((v) => { el.style.transform = `translateX(${v.x}px)`; });
    window.__probe = {
      async seek(t) {
        sheet.sequence.position = t;
        const value = box.value.x;
        await twoFrames();
        return { value, dom: readX(el), position: sheet.sequence.position };
      },
      info: () => ({ version: VERSIONS['@theatre/core'], length: sheet.sequence.length, modules: fetchedModules() }),
    };
    window.__ready = true;
  } catch (e) { window.__error = String(e && e.stack || e); window.__ready = true; }
</script>
